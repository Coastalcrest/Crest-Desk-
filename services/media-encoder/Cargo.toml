[package]
name = "crestdesk-media-encoder"
version = "0.0.1"
edition = "2021"
rust-version = "1.76"

[dependencies]
actix-web = "4.9"
actix-rt = "2.10"
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ffmpeg-next = "7.0"
image = "0.25"
uuid = { version = "1.11", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = "0.26"
opentelemetry-datadog = "0.14"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
