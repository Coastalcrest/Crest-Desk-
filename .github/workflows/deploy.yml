name: Deploy Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: echo "image-tag=${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Build and push gateway image
        run: |
          docker build -f services/gateway/Dockerfile -t ${{ env.ECR_REGISTRY }}/crestdesk-gateway:${{ env.IMAGE_TAG }} services/gateway
          docker push ${{ env.ECR_REGISTRY }}/crestdesk-gateway:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile -t ${{ env.ECR_REGISTRY }}/crestdesk-web:${{ env.IMAGE_TAG }} apps/web
          docker push ${{ env.ECR_REGISTRY }}/crestdesk-web:${{ env.IMAGE_TAG }}

      - name: Build and push compliance image
        run: |
          docker build -f services/compliance/Dockerfile -t ${{ env.ECR_REGISTRY }}/crestdesk-compliance:${{ env.IMAGE_TAG }} services/compliance
          docker push ${{ env.ECR_REGISTRY }}/crestdesk-compliance:${{ env.IMAGE_TAG }}

      - name: Build and push esign image
        run: |
          docker build -f services/esign/Dockerfile -t ${{ env.ECR_REGISTRY }}/crestdesk-esign:${{ env.IMAGE_TAG }} services/esign
          docker push ${{ env.ECR_REGISTRY }}/crestdesk-esign:${{ env.IMAGE_TAG }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy gateway to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/staging/gateway-task-def.json
          service: crestdesk-gateway-staging
          cluster: crestdesk-staging
          wait-for-service-stability: true

      - name: Deploy web to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/staging/web-task-def.json
          service: crestdesk-web-staging
          cluster: crestdesk-staging
          wait-for-service-stability: true

      - name: Deploy compliance to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/staging/compliance-task-def.json
          service: crestdesk-compliance-staging
          cluster: crestdesk-staging
          wait-for-service-stability: true

      - name: Deploy esign to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/staging/esign-task-def.json
          service: crestdesk-esign-staging
          cluster: crestdesk-staging
          wait-for-service-stability: true

  e2e-staging:
    name: E2E Tests on Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against staging
        run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-results
          path: playwright-report/
          retention-days: 7

  approve-prod:
    name: Approve Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [e2e-staging]
    environment: production-approval
    steps:
      - name: Manual approval gate
        run: echo "Production deployment approved by ${{ github.actor }}"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [approve-prod]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy gateway to ECS production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/production/gateway-task-def.json
          service: crestdesk-gateway-prod
          cluster: crestdesk-production
          wait-for-service-stability: true

      - name: Deploy web to ECS production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/production/web-task-def.json
          service: crestdesk-web-prod
          cluster: crestdesk-production
          wait-for-service-stability: true

      - name: Deploy compliance to ECS production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/production/compliance-task-def.json
          service: crestdesk-compliance-prod
          cluster: crestdesk-production
          wait-for-service-stability: true

      - name: Deploy esign to ECS production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/production/esign-task-def.json
          service: crestdesk-esign-prod
          cluster: crestdesk-production
          wait-for-service-stability: true

  smoke-prod:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-prod]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Health check - Gateway
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_GATEWAY_URL }}/health")
            if [ "$status" = "200" ]; then
              echo "Gateway health check passed"
              break
            fi
            echo "Attempt $i: Gateway returned $status, retrying in 10s..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "Gateway health check failed after 10 attempts"
            exit 1
          fi

      - name: Health check - Web
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_WEB_URL }}/health")
            if [ "$status" = "200" ]; then
              echo "Web health check passed"
              break
            fi
            echo "Attempt $i: Web returned $status, retrying in 10s..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "Web health check failed after 10 attempts"
            exit 1
          fi

      - name: Health check - Compliance
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_COMPLIANCE_URL }}/health")
            if [ "$status" = "200" ]; then
              echo "Compliance health check passed"
              break
            fi
            echo "Attempt $i: Compliance returned $status, retrying in 10s..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "Compliance health check failed after 10 attempts"
            exit 1
          fi

      - name: Health check - eSign
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_ESIGN_URL }}/health")
            if [ "$status" = "200" ]; then
              echo "eSign health check passed"
              break
            fi
            echo "Attempt $i: eSign returned $status, retrying in 10s..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "eSign health check failed after 10 attempts"
            exit 1
          fi

      - name: Verify deployment tag
        run: |
          echo "Deployed commit: ${{ env.IMAGE_TAG }}"
          echo "Production smoke tests passed successfully"
